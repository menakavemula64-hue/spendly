<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Spendly</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💸</text></svg>">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<main class="box">
  <div class="brand"><i>💸</i>Spendly</div>
  <h1>Welcome back</h1>
  <p class="sub">Log in to see your expenses.</p>
  <div id="msg" class="msg" hidden></div>

  <form id="auth-form" data-kind="login">
    <label>Email<input id="email" type="email" autocomplete="email" required autofocus></label>
    <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
    <div class="row"><a href="forgot.html">Forgot password?</a></div>
    <button type="submit">Log in</button>
  </form>
  <p class="foot">New here? <a href="register.html">Create an account</a></p>
  <div class="demo">Demo login for a portfolio project. Accounts are saved only in your browser and no real email is sent.</div>
</main>
<script src="auth.js"></script>
</body>
</html>
