<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spendly: Expense Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💸</text></svg>">
<script>try{if(!localStorage.getItem("spendly_session"))location.replace("login.html")}catch(e){}</script>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="hero"><div class="wrap">
<div class="top"><div class="logo"><i>💸</i>Spendly</div>
<div style="display:flex;gap:8px"><button class="ghost sm" id="themeBtn" style="background:rgba(255,255,255,.18);color:#fff;border-color:transparent">Theme</button><button class="ghost sm" id="exportBtn" style="background:rgba(255,255,255,.18);color:#fff;border-color:transparent">Export CSV</button><button class="ghost sm" id="logoutBtn" style="background:rgba(255,255,255,.18);color:#fff;border-color:transparent">Log out</button></div></div>
<h1>Know where your money goes</h1><p>Track spending, stay on budget, spot trends. Your data stays in this browser.</p>
</div></header>

<main class="main"><div class="wrap">
<section class="grid stats">
<div class="card stat"><span>Total spent</span><strong id="sTotal">₹0</strong><small id="sCount">0 entries</small></div>
<div class="card stat"><span>This month</span><strong id="sMonth">₹0</strong><small id="sMonthNote">&nbsp;</small></div>
<div class="card stat"><span>Daily average</span><strong id="sAvg">₹0</strong><small>this month</small></div>
<div class="card stat"><span>Top category</span><strong id="sTop">–</strong><small id="sTopAmt">&nbsp;</small></div>
</section>

<section class="card" style="margin-bottom:16px">
<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 style="margin:0">Monthly budget</h2>
<div style="display:flex;gap:8px;align-items:center"><input id="budgetIn" type="number" min="0" step="100" style="width:130px" aria-label="Monthly budget in rupees"><button class="ghost sm" id="budgetBtn">Set</button></div></div>
<div class="prog"><div id="prog" style="width:0"></div></div><small id="progNote" style="color:var(--muted)"></small>
</section>

<section class="grid two">
<div class="card"><h2>Spending by category</h2><div class="donut"><svg id="donut" width="150" height="150" viewBox="0 0 42 42" role="img" aria-label="Category breakdown"></svg><div class="legend" id="legend"></div></div></div>
<div class="card"><h2>Last 6 months</h2><div class="bars" id="bars"></div></div>
</section>

<section class="card">
<h2>Transactions</h2>
<div class="tools"><input type="search" id="q" placeholder="Search expenses"><select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="high">Highest amount</option></select></div>
<div class="chips" id="chips"></div>
<div id="list"></div>
</section>
</div></main>

<button class="fab" id="addBtn">+ Add expense</button>

<dialog id="dlg"><form id="f" method="dialog">
<h2 id="dTitle" style="margin:0">Add expense</h2>
<label>Title<input id="title" maxlength="100" placeholder="e.g. Lunch" required></label>
<label>Amount (₹)<input id="amount" type="number" step="0.01" min="0.01" required></label>
<label>Category<select id="cat"></select></label>
<label>Date<input id="date" type="date" required></label>
<div class="err" id="err"></div>
<div class="acts"><button type="button" class="ghost" id="cancel">Cancel</button><button type="submit" id="save">Save</button></div>
</form></dialog>

<script src="app.js"></script>
</body>
</html>
